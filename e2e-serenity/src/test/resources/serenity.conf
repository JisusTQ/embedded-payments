serenity {
  project.name = "Embedded Payments - E2E (Sprint 3)"
  take.screenshots = FOR_EACH_ACTION
  report.show.step.details = true
}

environments {
  default {
    frontend.url = "http://localhost:5173"
    api.url = "http://localhost:8085"
  }
}

webdriver {
  driver = chrome
  autodownload = true
  capabilities {
    browserName = "chrome"
    "goog:chromeOptions" {
      args = [
        "--headless=new",
        "--no-sandbox",
        "--disable-gpu",
        "--disable-dev-shm-usage",
        "--window-size=1366,900",
        "--remote-allow-origins=*"
      ]
    }
  }
}
